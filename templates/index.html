<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background: #0f0f0f;
    color: white;
    font-family: Arial;
}

.hero {
    height: 60vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
}
</style>

<div class="hero">
    <h1 class="display-3">Train Hard. Stay Strong.</h1>
    <p class="lead">Best Fitness Booking System</p>
</div>

<div class="container mt-5" id="auth">

    <div class="row justify-content-center">

        <div class="col-md-5">
            <h3>Login</h3>

            <form method="POST" action="/login">
                <input class="form-control mb-2" name="username" placeholder="Username">
                <input class="form-control mb-2" type="password" name="password" placeholder="Password">
                <button class="btn btn-danger w-100">Login</button>
            </form>
        </div>

        <div class="col-md-5">
            <h3>Register</h3>

            <form method="POST" action="/register">
                <input class="form-control mb-2" name="username" placeholder="Username">
                <input class="form-control mb-2" type="password" name="password" placeholder="Password">
                <button class="btn btn-secondary w-100">Register</button>
            </form>
        </div>

    </div>
</div>
