<link href="https://jsdelivr.net" rel="stylesheet">

<style>
    body {
        background: linear-gradient(rgba(11, 15, 20, 0.75), rgba(11, 15, 20, 0.75)), url('https://images.unsplash.com/photo-1571902943202-507ec2618e8f?q=80&w=1075&auto=format&fit=crop');
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        color: white;
        font-family: 'Segoe UI', Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
    }

    .auth-container {
        background: rgba(17, 24, 39, 0.8);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 20px;
        padding: 40px;
        width: 100%;
        max-width: 380px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        text-align: center;
    }

    .logo-placeholder {
        font-size: 26px;
        font-weight: 800;
        margin-bottom: 35px;
        letter-spacing: -1px;
    }

    .form-control-saas {
        background: rgba(15, 23, 42, 0.6);
        border: 1px solid #334155;
        color: white !important;
        padding: 14px;
        border-radius: 10px;
        margin-bottom: 15px;
    }

        .form-control-saas:focus {
            background: rgba(30, 41, 59, 0.8);
            border-color: #6366f1;
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
        }

    .btn-login {
        background: #6366f1;
        border: none;
        padding: 14px;
        font-weight: 700;
        width: 100%;
        border-radius: 10px;
        transition: 0.3s;
    }

        .btn-login:hover {
            background: #4f46e5;
            transform: translateY(-1px);
        }

    .create-account-link {
        display: block;
        margin-top: 25px;
        color: #9ca3af;
        text-decoration: none;
        font-size: 14px;
        transition: 0.2s;
        cursor: pointer;
    }

        .create-account-link:hover {
            color: white;
        }
</style>

<div class="auth-container">
    <div class="logo-placeholder">
        GYM <span id="logo-accent" style="color: #6366f1;">BRO</span>
    </div>

    <form id="auth-form" method="POST" action="/login">
        <input class="form-control form-control-saas" name="username" placeholder="Логин" required>
        <input class="form-control form-control-saas" type="password" name="password" placeholder="Пароль" required>

        <button type="submit" class="btn btn-primary btn-login">Вход</button>
    </form>

    <a class="create-account-link">Create Account</a>
</div>

<script>const link = document.querySelector('.create-account-link');
    const form = document.querySelector('#auth-form');
    const accent = document.querySelector('#logo-accent');
    const btn = document.querySelector('.btn-login');

    link.addEventListener('click', (e) => {
        e.preventDefault();

        // Если сейчас форма логина — меняем на регистрацию
        if (form.getAttribute('action') === '/login') {
            form.setAttribute('action', '/register');
            accent.innerText = 'REGISTRATION';
            btn.innerText = 'Зарегистрироваться';
            link.innerText = 'Already have an account? Login';
        } else {
            // И наоборот
            form.setAttribute('action', '/login');
            accent.innerText = 'BRO';
            btn.innerText = 'Вход';
            link.innerText = 'Create Account';
        }
    });</script>
